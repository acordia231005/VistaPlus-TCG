<header class="app-header">
  <div class="header-container">
    <div class="header-left">
      <button class="hamburger-btn mobile-only" (click)="toggleMobileMenu()" aria-label="Abrir menú">
        <div class="hamburger-icon" [class.open]="mobileMenuOpen()">
          <span></span><span></span><span></span>
        </div>
      </button>

      <div class="logo">
        <a routerLink="/" class="logo-link">
          <img src="Titulo.png" alt="VistaPlus">
        </a>
      </div>
    </div>

    <!-- Navegación Escritorio -->
    <nav class="nav desktop-only">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/peliculas" routerLinkActive="active">Películas</a>
      <a routerLink="/series" routerLinkActive="active">Series</a>
      <a routerLink="/libros" routerLinkActive="active">Libros</a>
    </nav>

    <div class="header-right-actions">
      <!-- Buscador -->
      <div class="busqueda desktop-only">
        <input type="text" placeholder="Buscar..." class="search-input" #searchInput (keyup.enter)="buscar(searchInput.value)">
        <button class="search-button" type="button" (click)="buscar(searchInput.value)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
          </svg>
        </button>
      </div>

      <!-- Botón Publicar (solo si tiene permisos) -->
      @if (canCreate()) {
        <a routerLink="/crear-obra" class="create-quick-btn desktop-only">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="btn-text">Publicar</span>
        </a>
      }

      <!-- Menú de Usuario -->
      <div class="user-menu-container">
        <button class="user-avatar" (click)="toggleMenu()">
          <span class="avatar-initial">{{ authService.currentUser()?.username?.charAt(0)?.toUpperCase() || 'U' }}</span>
        </button>

        @if (menuOpen()) {
          <div class="user-dropdown">
            <div class="dropdown-header">
              <span class="dropdown-name">{{ authService.currentUser()?.username || 'Usuario' }}</span>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-section">
              <a class="dropdown-item" routerLink="/perfil" (click)="closeMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Mi Perfil
              </a>
              <a class="dropdown-item" routerLink="/lista" (click)="closeMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                Mi Lista
              </a>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item dropdown-item-danger" (click)="logout()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>
  </div>

  <!-- Navegación Móvil -->
  <div class="mobile-side-menu" [class.active]="mobileMenuOpen()">
    <nav class="mobile-nav">
      <a routerLink="/" (click)="closeMobileMenu()">Inicio</a>
      <a routerLink="/peliculas" (click)="closeMobileMenu()">Películas</a>
      <a routerLink="/series" (click)="closeMobileMenu()">Series</a>
      <a routerLink="/libros" (click)="closeMobileMenu()">Libros</a>
      <a routerLink="/perfil" (click)="closeMobileMenu()">Mi Perfil</a>
    </nav>
  </div>
</header>
